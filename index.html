
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR-Geo | Teroka Bentuk 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eff6f8;
 color:#25475b
}
header{
 text-align:center;
 background:#dcecf4;
 padding:20px 12px
}
h1{margin:0;font-size:32px}
header p{margin:7px 0 0}
main{max-width:860px;margin:auto;padding:14px}
.viewer{
 position:relative;
 height:min(65vh,560px);
 min-height:330px;
 background:#18303d;
 border-radius:18px;
 overflow:hidden;
 touch-action:none
}
#camera{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover
}
#ar3d{
 position:absolute;
 inset:0;
 z-index:2;
 touch-action:none
}
#ar3d canvas{
 width:100%;
 height:100%;
 display:block
}
.badge{
 position:absolute;
 top:12px;
 left:12px;
 z-index:3;
 padding:9px 12px;
 border-radius:12px;
 background:#ffffffeb;
 font-weight:bold;
 font-size:13px;
 pointer-events:none
}
.hint{
 position:absolute;
 bottom:12px;
 left:12px;
 right:12px;
 z-index:3;
 padding:10px;
 border-radius:12px;
 background:#18303dd9;
 color:white;
 text-align:center;
 font-size:13px;
 pointer-events:none
}
.buttons{display:flex;gap:10px;margin:14px 0}
button{
 flex:1;
 border:0;
 border-radius:12px;
 padding:14px;
 background:#397d9b;
 color:white;
 font-size:15px;
 font-weight:bold;
 cursor:pointer
}
button.secondary{background:#647f8e}
button:disabled{opacity:.5}
.panel{
 background:white;
 border-radius:18px;
 padding:18px;
 margin:12px 0;
 box-shadow:0 2px 12px #24445912
}
.panel h2{margin:0 0 10px}
.muted{color:#617c89}
ul{line-height:1.8;padding-left:22px}
footer{
 text-align:center;
 padding:18px;
 color:#6c8590;
 font-size:12px
}
</style>
</head>

<body>
<header>
 <h1>AR-Geo</h1>
 <p>Teroka Bentuk Geometri 3D • Tahun 3</p>
</header>

<main>
 <section class="viewer">
  <video id="camera" autoplay muted playsinline></video>
  <div id="ar3d"></div>
  <div class="badge" id="badge">
   Sedia untuk mengimbas
  </div>
  <div class="hint">
   Halakan kamera kepada satu objek.
   Seret untuk putar • Cubit untuk zum
  </div>
 </section>

 <div class="buttons">
  <button id="start">Buka Kamera</button>
  <button id="stop" class="secondary">
   Tutup Kamera
  </button>
 </div>

 <section class="panel">
  <h2>Status</h2>
  <p id="status">Kamera belum dibuka.</p>
  <p id="confidence" class="muted"></p>
 </section>

 <section class="panel">
  <h2>Maklumat Bentuk Geometri</h2>
  <div id="info">
   <p class="muted">
    Bentuk akan dipaparkan apabila
    sistem berjaya mengenal pasti bentuk.
   </p>
  </div>
 </section>
</main>

<footer>AR-Geo | Matematik Tahun 3</footer>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const video=document.getElementById("camera");
const host=document.getElementById("ar3d");
const badge=document.getElementById("badge");
const status=document.getElementById("status");
const confidence=document.getElementById("confidence");
const info=document.getElementById("info");
const startBtn=document.getElementById("start");

const LABELS=[
 "kubus",
 "kuboid",
 "prisma segi tiga",
 "kon",
 "silinder",
 "sfera",
 "piramid segi empat sama"
];

// Urutan LABELS mesti sama dengan urutan
// kelas dalam model AI yang dilatih.

const DATA={
 "kubus":{
  category:"Prisma",
  facts:[
   "6 permukaan rata berbentuk segi empat sama",
   "8 bucu",
   "12 tepi"
  ]
 },
 "kuboid":{
  category:"Prisma",
  facts:[
   "6 permukaan rata",
   "8 bucu",
   "12 tepi"
  ]
 },
 "prisma segi tiga":{
  category:"Prisma",
  facts:[
   "5 permukaan rata",
   "6 bucu",
   "9 tepi"
  ]
 },
 "kon":{
  category:"Bukan prisma",
  facts:[
   "1 permukaan rata",
   "1 permukaan melengkung",
   "1 bucu",
   "1 tepi melengkung"
  ]
 },
 "silinder":{
  category:"Bukan prisma",
  facts:[
   "2 permukaan rata",
   "1 permukaan melengkung",
   "0 bucu",
   "2 tepi melengkung"
  ]
 },
 "sfera":{
  category:"Bukan prisma",
  facts:[
   "1 permukaan melengkung",
   "0 permukaan rata",
   "0 bucu",
   "0 tepi"
  ]
 },
 "piramid segi empat sama":{
  category:"Bukan prisma",
  facts:[
   "5 permukaan rata",
   "5 bucu",
   "8 tepi"
  ]
 }
};

let stream=null;
let classifier=null;
let running=false;
let session=0;
let currentShape=null;
let mesh=null;
let zoom=4.2;
let lastPrediction=null;
let stableCount=0;

const scene=new THREE.Scene();

const camera3d=new THREE.PerspectiveCamera(
 40,1,.1,100
);
camera3d.position.set(0,.8,zoom);
camera3d.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:true
});
renderer.setPixelRatio(
 Math.min(devicePixelRatio||1,2)
);
renderer.setClearColor(0x000000,0);
host.appendChild(renderer.domElement);

scene.add(
 new THREE.HemisphereLight(
  0xffffff,0x91b0c3,2.2
 )
);

const light=new THREE.DirectionalLight(
 0xffffff,2.2
);
light.position.set(3,5,6);
scene.add(light);

function resize(){
 const w=host.clientWidth;
 const h=host.clientHeight;
 if(!w||!h)return;
 camera3d.aspect=w/h;
 camera3d.updateProjectionMatrix();
 renderer.setSize(w,h,false);
}
resize();
window.addEventListener("resize",resize);
if(window.ResizeObserver){
 new ResizeObserver(resize).observe(host);
}

function setZoom(z){
 zoom=Math.max(2.3,Math.min(9,z));
 camera3d.position.set(0,zoom*.19,zoom);
 camera3d.lookAt(0,0,0);
}

const pointers=new Map();
let previousPinch=null;

host.addEventListener("pointerdown",e=>{
 pointers.set(e.pointerId,{
  x:e.clientX,y:e.clientY
 });
 host.setPointerCapture(e.pointerId);
});

host.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);
 pointers.set(e.pointerId,{
  x:e.clientX,y:e.clientY
 });
 if(!mesh)return;

 if(pointers.size===1){
  mesh.rotation.y+=(e.clientX-old.x)*.012;
  mesh.rotation.x+=(e.clientY-old.y)*.012;
 }else if(pointers.size===2){
  const p=[...pointers.values()];
  const d=Math.hypot(
   p[0].x-p[1].x,p[0].y-p[1].y
  );
  if(previousPinch!==null){
   setZoom(zoom+(previousPinch-d)*.012);
  }
  previousPinch=d;
 }
});

function endPointer(e){
 pointers.delete(e.pointerId);
 previousPinch=null;
}
host.addEventListener("pointerup",endPointer);
host.addEventListener("pointercancel",endPointer);
host.addEventListener("wheel",e=>{
 e.preventDefault();
 setZoom(zoom+Math.sign(e.deltaY)*.3);
},{passive:false});

function geometry(name){
 switch(name){
  case "kubus":
   return new THREE.BoxGeometry(1.7,1.7,1.7);
  case "kuboid":
   return new THREE.BoxGeometry(2.1,1.3,1.4);
  case "prisma segi tiga":{
   const s=new THREE.Shape();
   s.moveTo(-1,-.7);
   s.lineTo(1,-.7);
   s.lineTo(0,.95);
   s.closePath();
   const g=new THREE.ExtrudeGeometry(s,{
    depth:1.3,bevelEnabled:false
   });
   g.translate(0,0,-.65);
   return g;
  }
  case "kon":
   return new THREE.ConeGeometry(.95,1.9,64);
  case "silinder":
   return new THREE.CylinderGeometry(.9,.9,1.8,64);
  case "sfera":
   return new THREE.SphereGeometry(1,48,32);
  case "piramid segi empat sama":
   return new THREE.CylinderGeometry(
    0,1.15,1.9,4,1
   );
  default:return null;
 }
}

function removeShape(){
 if(!mesh)return;
 scene.remove(mesh);
 mesh.traverse(child=>{
  if(child.geometry)child.geometry.dispose();
  if(child.material)child.material.dispose();
 });
 mesh=null;
}

function showShape(name,score){
 if(name===currentShape)return;
 currentShape=name;
 removeShape();

 if(!name){
  badge.textContent="Mencari bentuk...";
  info.textContent=
   "Bentuk belum dapat dikenal pasti.";
  return;
 }

 const g=geometry(name);
 if(!g)return;

 mesh=new THREE.Mesh(
  g,
  new THREE.MeshStandardMaterial({
   color:0x79c6dd,
   roughness:.7,
   transparent:true,
   opacity:.92
  })
 );
 mesh.rotation.set(.2,.4,0);
 scene.add(mesh);

 mesh.add(new THREE.LineSegments(
  new THREE.EdgesGeometry(g),
  new THREE.LineBasicMaterial({
   color:0x286b8a
  })
 ));

 badge.textContent=name.toUpperCase();

 const item=DATA[name];
 info.replaceChildren();

 const title=document.createElement("h3");
 title.textContent=name.toUpperCase();

 const cat=document.createElement("p");
 cat.textContent="Kategori: "+item.category;

 const ul=document.createElement("ul");
 item.facts.forEach(f=>{
  const li=document.createElement("li");
  li.textContent=f;
  ul.appendChild(li);
 });

 info.append(title,cat,ul);
}

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera3d);
}
animate();

function stopCamera(){
 running=false;
 session++;
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
 video.srcObject=null;
 currentShape=null;
 removeShape();
 badge.textContent="Sedia untuk mengimbas";
 confidence.textContent="";
 status.textContent="Kamera ditutup.";
 startBtn.disabled=false;
 lastPrediction=null;
 stableCount=0;
}

async function startCamera(){
 stopCamera();
 const id=++session;
 startBtn.disabled=true;
 status.textContent="Membuka kamera...";

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error("Kamera tidak disokong.");
  }

  const newStream=
   await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
     facingMode:{ideal:"environment"}
    }
   });

  if(id!==session){
   newStream.getTracks().forEach(t=>t.stop());
   return;
  }

  stream=newStream;
  video.srcObject=stream;
  await video.play();

  status.textContent=
   "Memuatkan model pengecaman geometri...";

  if(!window.tf){
   throw new Error(
    "TensorFlow.js gagal dimuatkan."
   );
  }

  // Letakkan model AI yang sudah dilatih
  // dalam folder model/model.json.
  if(!classifier){
   classifier=await tf.loadLayersModel(
    "./model/model.json"
   );
  }

  if(id!==session)return;

  running=true;
  status.textContent=
   "Kamera aktif. Mengimbas bentuk...";
  detect(id);

 }catch(err){
  stopCamera();
  status.textContent=
   "Pengecaman belum tersedia: "+
   err.message+
   ". Pastikan model AI telah dimuat naik.";
 }
}

async function detect(id){
 if(!running||id!==session)return;

 try{
  if(video.readyState>=2){

   // Input model ini diandaikan 224x224,
   // RGB, dengan nilai piksel 0 hingga 1.
   // Ubah mengikut prapemprosesan sebenar
   // model yang dilatih.
   const input=tf.tidy(()=>
    tf.browser.fromPixels(video)
     .resizeBilinear([224,224])
     .toFloat()
     .div(255)
     .expandDims(0)
   );

   const output=classifier.predict(input);
   const scores=await output.data();

   input.dispose();
   output.dispose();

   if(!running||id!==session)return;

   if(scores.length!==LABELS.length){
    throw new Error(
     "Bilangan kelas model tidak sepadan."
    );
   }

   let best=0;
   for(let i=1;i<scores.length;i++){
    if(scores[i]>scores[best])best=i;
   }

   const score=scores[best];
   const name=LABELS[best];

   confidence.textContent=
    "Anggaran keyakinan: "+
    Math.round(score*100)+"%";

   // Syarat sementara: 80% dan
   // tiga bacaan berturut-turut.
   if(score>=.8){
    if(lastPrediction===name){
     stableCount++;
    }else{
     lastPrediction=name;
     stableCount=1;
    }

    if(stableCount>=3){
     showShape(name,score);
    }
   }else{
    lastPrediction=null;
    stableCount=0;
    showShape(null);
   }
  }
 }catch(err){
  status.textContent=
   "Ralat pengecaman: "+err.message;
 }

 if(running&&id===session){
  setTimeout(()=>detect(id),500);
 }
}

document.getElementById("start")
 .addEventListener("click",startCamera);
document.getElementById("stop")
 .addEventListener("click",stopCamera);
window.addEventListener("pagehide",stopCamera);

</script>
</body>
</html>
