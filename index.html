
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR-Geo Tahun 3</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #edf6f7;
  color: #173b4b;
  text-align: center;
}
header { background: #d7edf0; padding: 20px; }
main { max-width: 800px; margin: auto; padding: 16px; }
video {
  width: 100%;
  max-height: 60vh;
  background: #10242b;
  border-radius: 16px;
  object-fit: cover;
}
button, select {
  padding: 12px;
  margin: 6px;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
}
button { background: #ffcf8a; cursor: pointer; }
section {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-top: 16px;
}
</style>
</head>
<body>
<header>
  <h1>AR-Geo: Peneroka Bentuk</h1>
  <p>Kenali bentuk 3D di sekeliling kita!</p>
</header>
<main>
  <video id="camera" autoplay playsinline muted></video>
  <div>
    <button onclick="startCamera()">Buka Kamera</button>
    <button onclick="stopCamera()">Tutup Kamera</button>
  </div>
  <section>
    <h2>Jom Kenali Bentuk!</h2>
    <p>Versi awal: pilih bentuk secara manual.</p>
    <select id="shape" onchange="showShape()">
      <option value="">Pilih bentuk</option>
      <option>Kubus</option>
      <option>Kuboid</option>
      <option>Prisma segi tiga</option>
      <option>Kon</option>
      <option>Silinder</option>
      <option>Sfera</option>
      <option>Piramid segi empat sama</option>
    </select>
    <div id="result"></div>
  </section>
</main>
<script>
let stream;
const camera = document.getElementById("camera");

async function startCamera() {
  try {
    stopCamera();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });
    camera.srcObject = stream;
    await camera.play();
  } catch (error) {
    alert("Kamera tidak dapat dibuka: " + error.message);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  camera.srcObject = null;
}

function showShape() {
  const shape = document.getElementById("shape").value;
  const prism = ["Kubus", "Kuboid", "Prisma segi tiga"];
  document.getElementById("result").textContent =
    shape ? shape + " — " +
    (prism.includes(shape) ? "Prisma" : "Bukan prisma") : "";
}
</script>
</body>
</html>
